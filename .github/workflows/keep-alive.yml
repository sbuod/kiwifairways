name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every Monday and Thursday
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # lets you manually trigger it from the Actions tab too

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          curl -X GET \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/course_info?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"